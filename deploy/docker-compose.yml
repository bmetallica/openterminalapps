# OpenTerminalApps — Basisstack
#
# Port 443 gehört noch Kasm. OTA läuft deshalb auf 8443, bis Kasm abgelöst ist
# (siehe roadmap.md M6). Der Umzug ist dann eine Zeile in der .env.

name: ota

services:

  traefik:
    image: traefik:v3.7
    container_name: ota-traefik
    restart: unless-stopped
    ports:
      - "${OTA_HTTP_PORT:-8081}:8080"     # leitet auf HTTPS um
      - "${OTA_HTTPS_PORT:-8443}:8443"
      - "127.0.0.1:8449:8081"             # Dashboard, nur lokal erreichbar
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./certs:/etc/traefik/certs:ro
      # Nur lesend: Traefik muss Container sehen, aber keine starten.
      # Das Starten macht später ausschliesslich ota-agent.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Docker 29 hat die API-Versionen unter 1.40 abgeschafft. Traefiks
      # Docker-Client meldet sich sonst mit 1.24 und bekommt vom Daemon
      # "client version 1.24 is too old" — der Docker-Provider bleibt dann
      # komplett stumm und keine einzige Route entsteht.
      # Docker 29 hat die API-Versionen unter 1.40 abgeschafft. Ältere
      # Traefik-Versionen melden sich fest mit 1.24 und der Docker-Provider
      # bleibt dann stumm — keine einzige Route entsteht, ohne dass am
      # Router etwas falsch aussieht. Ab v3.7 wird die Version ausgehandelt;
      # die Variable bleibt als Sicherheitsnetz stehen.
      DOCKER_API_VERSION: "${DOCKER_API_VERSION:-1.44}"
    networks:
      - public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # --- TURN: der Medienweg fuer Selkies ------------------------------------
  #
  # Nur fuer Vorlagen mit `stream_engine=selkies`. KasmVNC braucht ihn nicht;
  # dort geht alles durch Traefik.
  #
  # **Warum ein eigener Dienst und nicht im Session-Container.** Genau so lief
  # es zuerst, und es kann nicht funktionieren. Ein TURN-Server hinter einer
  # Docker-Bridge meldet als Relay die Adresse des Hosts, verschickt die
  # vermittelten Pakete aber mit der Container-Adresse als Absender. Gemessen
  # mit `scripts/pruef-turn.py` gegen die alte Fassung:
  #
  #     5. Client -> Relay -> Peer: b'HINAUS' von 192.168.0.4:65502
  #        Absender != Relay 192.168.66.224:65502
  #
  # Jeder WebRTC-Stack verwirft ein Paket, dessen Absender nicht zu dem
  # Kandidaten passt, auf den er wartet. Im Browser sah das aus wie
  # "Waiting for stream", im Container wie "Fatal SSL error" beim
  # DTLS-Handschlag - die Ursache stand an keiner der beiden Stellen.
  #
  # `network_mode: host` ist deshalb keine Bequemlichkeit, sondern die
  # Bedingung: Nur ohne NAT dazwischen stimmen gemeldete und tatsaechliche
  # Adresse ueberein.
  #
  # Ein gemeinsamer Dienst statt einem je Sitzung bringt nebenbei das, was
  # vorher fehlte: mehr als eine Selkies-Sitzung je Host. Der Portbereich
  # wird nicht mehr je Container veroeffentlicht, sondern einmal geteilt.
  turn:
    image: coturn/coturn:4.6-alpine
    container_name: ota-turn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=${OTA_TURN_PORT:-3478}
      # Beide Adressen ausdruecklich und nicht 0.0.0.0: Der Host hat neben
      # dem Firmennetz ein Dutzend Docker-Bruecken, und coturn boete sonst
      # Relay-Kandidaten in Netzen an, die kein Browser erreicht.
      #
      # Ohne OTA_TURN_HOST bleibt der Dienst auf dem Rueckkanal. Er
      # stoert dort niemanden, und ohne diese Angabe ist Selkies ohnehin
      # nicht in Gebrauch.
      - --listening-ip=${OTA_TURN_HOST:-127.0.0.1}
      - --relay-ip=${OTA_TURN_HOST:-127.0.0.1}
      # Rund hundert Relay-Ports fuer den ganzen Host. Vorher waren es elf je
      # Container, und die waren nach drei Anlaeufen aufgebraucht - eine
      # Anmeldung belegt vier Stueck, und coturn gibt sie erst nach Ablauf
      # der Lebenszeit wieder frei.
      - --min-port=${OTA_TURN_MIN:-49160}
      - --max-port=${OTA_TURN_MAX:-49260}
      - --realm=openterminalapps
      # Kurzlebige Anmeldedaten aus einem HMAC statt eines festen Passworts:
      # Selkies rechnet sie sich aus demselben Geheimnis aus und gibt sie dem
      # Browser mit Ablaufzeit mit. Ein abgefangener Zugang ist damit Stunden
      # spaeter wertlos - und das Sitzungspasswort steht nicht mehr drin.
      - --use-auth-secret
      - --static-auth-secret=${OTA_TURN_SECRET:-}
      - --no-tls
      - --no-dtls
      - --no-cli
      - --no-multicast-peers
      # Kein Weg in die eigenen Netze. Ohne diese Zeilen stuende im Firmennetz
      # ein Dienst, ueber den sich Datenbank und Keycloak erreichen liessen -
      # vorbei an Traefik und ohne Anmeldung an OTA. Die Bereiche sind die
      # Subnetze von ota_public, ota_internal und ota_sessions.
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.15.255
      # Knapp protokollieren. Für die Fehlersuche am Medienweg lohnt
      # `OTA_TURN_LOG=verbose` in der .env — dann steht je Sitzung drin,
      # welche Erlaubnisse entstehen und was durch die Relays geht.
      - --${OTA_TURN_LOG:-simple-log}
      - --log-file=stdout

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Docker kennt diese sechs vorab: Sie wirken in jedem RUN, ohne dass im
        # Dockerfile ein ARG steht, und landen **nicht** im fertigen Image.
        # Leer heisst: kein Proxy, und alles verhaelt sich wie ohne diese Zeilen.
        http_proxy: "${OTA_HTTP_PROXY:-}"
        https_proxy: "${OTA_HTTPS_PROXY:-}"
        no_proxy: "${OTA_NO_PROXY:-}"
        HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
        HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
        NO_PROXY: "${OTA_NO_PROXY:-}"
    image: ota/web:${OTA_VERSION:-dev}
    container_name: ota-web
    restart: unless-stopped
    volumes:
      # Nur die Konfiguration wird gemountet — der gebaute Inhalt steckt im Image.
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - public
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ota-web.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ota-web.entrypoints=websecure"
      - "traefik.http.routers.ota-web.tls=true"
      - "traefik.http.routers.ota-web.priority=1"
      - "traefik.http.routers.ota-web.middlewares=ota-headers@file"
      - "traefik.http.services.ota-web.loadbalancer.server.port=80"
    healthcheck:
      # 127.0.0.1 statt localhost: localhost löst im Container zuerst auf ::1
      # auf, nginx lauscht aber nur auf IPv4. Sonst bleibt der Container
      # dauerhaft "unhealthy" — und Traefik ignoriert unhealthy Container
      # kommentarlos, sodass keine Route entsteht.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
      args:
        # Docker kennt diese sechs vorab: Sie wirken in jedem RUN, ohne dass im
        # Dockerfile ein ARG steht, und landen **nicht** im fertigen Image.
        # Leer heisst: kein Proxy, und alles verhaelt sich wie ohne diese Zeilen.
        http_proxy: "${OTA_HTTP_PROXY:-}"
        https_proxy: "${OTA_HTTPS_PROXY:-}"
        no_proxy: "${OTA_NO_PROXY:-}"
        HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
        HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
        NO_PROXY: "${OTA_NO_PROXY:-}"
    image: ota/api:${OTA_VERSION:-dev}
    container_name: ota-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      agent:
        condition: service_healthy
    environment:
      # Firmenproxy. Leer heisst: kein Proxy — die Vorgabe.
      #
      # `NO_PROXY` ist hier nicht Beiwerk: Ohne die Namen der eigenen Dienste
      # liefe jeder Aufruf an Agent, Keycloak und Registry durch den Proxy,
      # der sie nicht kennt. Siehe deploy/.env.example.
      HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
      HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
      NO_PROXY: "${OTA_NO_PROXY:-}"
      http_proxy: "${OTA_HTTP_PROXY:-}"
      https_proxy: "${OTA_HTTPS_PROXY:-}"
      no_proxy: "${OTA_NO_PROXY:-}"
      OTA_DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-ota}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-ota}"
      OTA_JWT_SECRET: "${OTA_JWT_SECRET:?OTA_JWT_SECRET fehlt in deploy/.env}"
      OTA_AGENT_URL: "http://agent:8100"
      OTA_AGENT_TOKEN: "${OTA_AGENT_TOKEN:?OTA_AGENT_TOKEN fehlt in deploy/.env}"
      OTA_PROFILES_ROOT: "${OTA_PROFILES_ROOT:-/srv/ota/profiles}"
      # Nur, um Images der eigenen Registry als eigene zu erkennen.
      OTA_REGISTRY: "${OTA_REGISTRY:-127.0.0.1:5000}"
      # Leer heisst: nur Administratoren kommen an /metrics.
      OTA_METRICS_TOKEN: "${OTA_METRICS_TOKEN:-}"
      OTA_COOKIE_SECURE: "true"
      # Identitaet. Bei "vorhanden" zeigt OTA_KEYCLOAK_URL auf das fremde
      # Keycloak; leer heisst: der mitgelieferte aus diesem Stack.
      OTA_IDP_MODE: "${OTA_IDP_MODE:-mitgeliefert}"
      OTA_KEYCLOAK_URL: "${OTA_KEYCLOAK_URL:-}"
      OTA_KEYCLOAK_REALM: "${OTA_KEYCLOAK_REALM:-ota}"
      OTA_KEYCLOAK_SECRET: "${OTA_KEYCLOAK_SECRET:-}"
    volumes:
      # Das Handbuch wird eingehaengt statt ins Abbild kopiert: So laesst es
      # sich nachbessern, ohne das Abbild neu zu bauen — dieselbe Ueberlegung
      # wie bei der nginx-Konfiguration.
      - ../docs/wiki:/app/wiki:ro
      # Die Firefox-Erweiterung wird beim Abruf gepackt, nicht beim Bauen.
      - ../extension:/app/extension:ro
      # Nur die oeffentlichen Zertifikate, nie die Schluessel: Die API haendigt
      # unter /ca.crt die eigene CA aus, damit fremde Anwendungen ihr vertrauen
      # koennen, ohne dass jemand eine Datei suchen muss.
      - ./certs:/app/certs:ro
    networks:
      - public      # damit Traefik sie erreicht
      - internal    # damit sie DB und Agent erreicht
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ota_public"
      # /healthz und /metrics liegen bewusst nicht unter /api: Ein
      # Überwachungssystem soll sie an der Stelle finden, an der es sie sucht.
      - "traefik.http.routers.ota-api.rule=PathPrefix(`/api`) || Path(`/healthz`) || Path(`/metrics`) || Path(`/ca.crt`)"
      - "traefik.http.routers.ota-api.entrypoints=websecure"
      - "traefik.http.routers.ota-api.tls=true"
      - "traefik.http.routers.ota-api.priority=50"
      - "traefik.http.routers.ota-api.middlewares=ota-headers@file"
      - "traefik.http.services.ota-api.loadbalancer.server.port=8000"

  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
      args:
        # Docker kennt diese sechs vorab: Sie wirken in jedem RUN, ohne dass im
        # Dockerfile ein ARG steht, und landen **nicht** im fertigen Image.
        # Leer heisst: kein Proxy, und alles verhaelt sich wie ohne diese Zeilen.
        http_proxy: "${OTA_HTTP_PROXY:-}"
        https_proxy: "${OTA_HTTPS_PROXY:-}"
        no_proxy: "${OTA_NO_PROXY:-}"
        HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
        HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
        NO_PROXY: "${OTA_NO_PROXY:-}"
    image: ota/agent:${OTA_VERSION:-dev}
    container_name: ota-agent
    restart: unless-stopped
    environment:
      # Firmenproxy. Leer heisst: kein Proxy — die Vorgabe.
      #
      # `NO_PROXY` ist hier nicht Beiwerk: Ohne die Namen der eigenen Dienste
      # liefe jeder Aufruf an Agent, Keycloak und Registry durch den Proxy,
      # der sie nicht kennt. Siehe deploy/.env.example.
      HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
      HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
      NO_PROXY: "${OTA_NO_PROXY:-}"
      http_proxy: "${OTA_HTTP_PROXY:-}"
      https_proxy: "${OTA_HTTPS_PROXY:-}"
      no_proxy: "${OTA_NO_PROXY:-}"
      OTA_AGENT_TOKEN: "${OTA_AGENT_TOKEN:?OTA_AGENT_TOKEN fehlt in deploy/.env}"
      OTA_PROFILES_ROOT: "${OTA_PROFILES_ROOT:-/srv/ota/profiles}"
      OTA_RUNTIME_ROOT: "${OTA_RUNTIME_ROOT:-/srv/ota/runtime}"
      # Leer lassen schaltet die Registry ab; dann bleiben Images nur lokal.
      OTA_REGISTRY: "${OTA_REGISTRY:-127.0.0.1:5000}"
      # Gemeinsame Ablage. In Session-Containern nur lesbar; geschrieben wird
      # ausschliesslich ueber die Oberflaeche.
      OTA_SHARED_ROOT: "${OTA_SHARED_ROOT:-/srv/ota/shared}"
      # Eigene Ablage je Nutzer. Anders als die gemeinsame liegt sie
      # beschreibbar im Container — der Weg hinein und wieder heraus.
      OTA_USERFILES_ROOT: "${OTA_USERFILES_ROOT:-/srv/ota/userfiles}"
      # Gemeinsame Laufwerke je Gruppe. Wie die eigene Ablage beschreibbar,
      # aber fuer alle Mitglieder dieselben Dateien. Benannt nach der Kennung
      # der Gruppe, nicht nach ihrem Namen — der laesst sich aendern.
      OTA_GROUPFILES_ROOT: "${OTA_GROUPFILES_ROOT:-/srv/ota/groupfiles}"
      # Skeleton-Profile je Workspace: womit ein Zuhause anfaengt.
      OTA_SKELETON_ROOT: "${OTA_SKELETON_ROOT:-/srv/ota/skeletons}"
      # Wohin der Browser für den WebRTC-Medienstrom greift, wenn eine
      # Vorlage auf Selkies steht (Versuchsweg, `roadmap.md`). Es muss die
      # Adresse sein, unter der die **Browser** diesen Host erreichen — nicht
      # die eines Docker-Netzes. Leer heisst: kein Selkies.
      #
      # Der Agent reicht die drei Angaben nur durch; erreichbar sein muss der
      # Dienst `turn` weiter oben, nicht der Session-Container. Ports
      # veröffentlicht der Agent für Selkies deshalb keine mehr.
      OTA_TURN_HOST: "${OTA_TURN_HOST:-}"
      OTA_TURN_PORT: "${OTA_TURN_PORT:-3478}"
      OTA_TURN_SECRET: "${OTA_TURN_SECRET:-}"
      OTA_TURN_PROTOCOL: "${OTA_TURN_PROTOCOL:-udp}"
      OTA_TURN_ICE_POLICY: "${OTA_TURN_ICE_POLICY:-all}"
      OTA_SESSION_NETWORK: ota_sessions
      OTA_PUBLIC_NETWORK: ota_public
      OTA_BACKUP_ROOT: "${OTA_BACKUP_ROOT:-/srv/ota/backups}"
      # Ein Netz je Sitzung, aus einem eigenen Bereich. Nicht aus Dockers
      # Vorrat: Der ist auf einer gewachsenen Maschine schnell leer, und
      # 192.168.x ist in vielen Firmennetzen die LAN-Adresse.
      OTA_SESSION_POOL: "${OTA_SESSION_POOL:-10.99.0.0/16}"
      OTA_SESSION_PREFIX: "${OTA_SESSION_PREFIX:-24}"
      OTA_SESSION_MTU: "${OTA_SESSION_MTU:-1500}"
      OTA_TRAEFIK_CONTAINER: ota-traefik
      OTA_FW_SOCKET: "${OTA_RUNTIME_ROOT:-/srv/ota/runtime}/firewall.sock"
      # Damit der Browser im Arbeitsplatz OTA selbst erreicht — die
      # Firefox-Erweiterung für die Zwischenablage wird von dort geladen.
      OTA_SELF_ADDRESS: "${OTA_TURN_HOST:-}"
      OTA_HTTPS_PORT: "${OTA_HTTPS_PORT:-8443}"
      OTA_TURN_MIN: "${OTA_TURN_MIN:-49160}"
      OTA_TURN_MAX: "${OTA_TURN_MAX:-49260}"
    volumes:
      # Der einzige Dienst mit Schreibzugriff auf den Docker-Socket.
      # Die API bekommt ihn bewusst nicht — sie verarbeitet Nutzereingaben.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${OTA_PROFILES_ROOT:-/srv/ota/profiles}:${OTA_PROFILES_ROOT:-/srv/ota/profiles}
      # Dateien, die der Agent in Session-Container einhaengt. Muss auf beiden
      # Seiten derselbe Pfad sein: Docker loest Bind-Mounts gegen den Host auf.
      - ${OTA_RUNTIME_ROOT:-/srv/ota/runtime}:${OTA_RUNTIME_ROOT:-/srv/ota/runtime}
      # Derselbe Pfad auf beiden Seiten, damit der Agent ihn als
      # Bind-Mount in Session-Container weiterreichen kann.
      - ${OTA_SHARED_ROOT:-/srv/ota/shared}:${OTA_SHARED_ROOT:-/srv/ota/shared}
      - ${OTA_USERFILES_ROOT:-/srv/ota/userfiles}:${OTA_USERFILES_ROOT:-/srv/ota/userfiles}
      - ${OTA_GROUPFILES_ROOT:-/srv/ota/groupfiles}:${OTA_GROUPFILES_ROOT:-/srv/ota/groupfiles}
      - ${OTA_SKELETON_ROOT:-/srv/ota/skeletons}:${OTA_SKELETON_ROOT:-/srv/ota/skeletons}
      # Ein einziges Wurzelverzeichnis für alle Sicherungen. Genau deshalb
      # lässt es sich später ohne Änderung an OTA durch einen NFS-Mount
      # ersetzen — die Anwendung sieht weiterhin nur diesen Pfad.
      - ${OTA_BACKUP_ROOT:-/srv/ota/backups}:${OTA_BACKUP_ROOT:-/srv/ota/backups}
    networks:
      # Kein "public": Von aussen ist der Agent nicht erreichbar.
      #
      # Und **kein "sessions" mehr** (2026-09-04): Der Agent hing dort, damit
      # Compose das Netz anlegt — und war damit aus jedem Arbeitsplatz
      # erreichbar (`security.md`, H3). Er ist der einzige Dienst mit
      # schreibendem Zugriff auf den Docker-Socket; das war die kürzeste
      # Strecke von einem beliebigen Nutzer zu root auf dem Wirt. Die
      # Sitzungsnetze legt jetzt der Agent selbst an, eines je Sitzung.
      - internal
    labels:
      - "traefik.enable=false"

  # ------------------------------------------------------------------
  # Eigene Registry
  #
  # Wozu, wenn die Images ohnehin im Docker-Store liegen? Zwei Gruende, und
  # das Zurueckdrehen einer Fassung ist keiner davon — das kann OTA laengst
  # ueber `image_builds`.
  #
  #   1. Ein zweiter Host. Ohne Registry existieren die eigenen Golden Images
  #      nur lokal; eine zweite Maschine koennte sie nicht bekommen.
  #   2. Fremdes Aufraeumen. Kasms Agent hat auf diesem Host schon einmal
  #      jedes ihm unbekannte Image geloescht. Das Label-Problem ist umgangen,
  #      aber eine Kopie ausserhalb des Stores ist der stabilere Schutz.
  #
  # Veroeffentlicht auf 127.0.0.1: Der Docker-Daemon laeuft auf dem Host und
  # muss die Registry erreichen, nicht ein Container. Und Docker verlangt fuer
  # localhost kein TLS — deshalb braucht diese Registry weder Zertifikat noch
  # einen Eintrag in daemon.json. Von aussen ist sie damit nicht erreichbar;
  # wer sie einem zweiten Host anbieten will, stellt sie hinter Traefik.
  # ---------------------------------------------------------------- Firewall
  #
  # Schreibt Regeln, transportiert keine Pakete. Er laeuft im Netzwerk-
  # Namensraum des Wirts, weil dort die Regeln hingehoeren — ein Container als
  # *Router* funktionierte nicht: Docker richtet fuer jedes Bridge-Netz eigenes
  # NAT ein, der Weg nach draussen ginge an ihm vorbei, und ihn zum Gateway zu
  # machen braeuchte NET_ADMIN **im Sitzungscontainer** (firewall.md).
  firewall:
    build:
      context: ../firewall
      dockerfile: Dockerfile
      args:
        http_proxy: "${OTA_HTTP_PROXY:-}"
        https_proxy: "${OTA_HTTPS_PROXY:-}"
        no_proxy: "${OTA_NO_PROXY:-}"
        HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
        HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
        NO_PROXY: "${OTA_NO_PROXY:-}"
    image: ota/firewall:${OTA_VERSION:-dev}
    container_name: ota-firewall
    restart: unless-stopped
    # Der Namensraum des Wirts: Nur hier sind die Ketten die des Wirts.
    network_mode: host
    cap_add:
      # Mehr nicht. Kein privileged, kein Docker-Socket, keine Datenbank.
      - NET_ADMIN
      - NET_RAW
    environment:
      OTA_AGENT_TOKEN: "${OTA_AGENT_TOKEN}"
      OTA_SESSION_POOL: "${OTA_SESSION_POOL:-10.99.0.0/16}"
      OTA_FW_RESYNC: "${OTA_FW_RESYNC:-30}"
      # Wen der eigene Resolver fragt. Leer heisst: die Nameserver des Wirts.
      OTA_FW_DNS_UPSTREAM: "${OTA_FW_DNS_UPSTREAM:-}"
    volumes:
      # Der Draht zum Agent — ein Socket, kein Port. Ein Port waere im
      # Namensraum des Wirts auf **jeder** seiner Adressen offen.
      - ${OTA_RUNTIME_ROOT:-/srv/ota/runtime}:/srv/ota/runtime
      - ota_firewall_state:/var/lib/ota-firewall
    healthcheck:
      test: ["CMD-SHELL", "test -S /srv/ota/runtime/firewall.sock"]
      interval: 20s
      timeout: 5s
      retries: 3

  registry:
    image: registry:2
    container_name: ota-registry
    restart: unless-stopped
    environment:
      # Loeschen erlauben. Ohne das laesst sich eine alte Fassung nur
      # verstecken, nicht entfernen.
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - registry-data:/var/lib/registry
    ports:
      - "127.0.0.1:${OTA_REGISTRY_PORT:-5000}:5000"
    networks:
      - public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/v2/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: ota-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ota}"
      POSTGRES_USER: "${POSTGRES_USER:-ota}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env}"
      # Deutsche Sortierung, damit Namenslisten erwartungsgemäss sortieren.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      # Bewusst NICHT im Netz "public" und nicht im Netz "sessions":
      # Die Datenbank ist von aussen und aus Session-Containern nicht erreichbar.
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ota} -d ${POSTGRES_DB:-ota}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # Keycloak — die zentrale Identität (auth-roadmap.md)
  #
  # Steht hier als **mitgelieferte** Betriebsart. Wer schon ein Keycloak
  # betreibt, setzt OTA_IDP_MODE=vorhanden und OTA_KEYCLOAK_URL; dann bleibt
  # dieser Dienst ungenutzt stehen und darf abgeschaltet werden.
  #
  # In beiden Netzen: `internal` fuer die Datenbank, `public` fuer Traefik —
  # und weil `internal` keinen Weg nach draussen hat, ein spaeteres Active
  # Directory aber ausserhalb steht.
  # ------------------------------------------------------------------
  keycloak-db-init:
    image: postgres:16-alpine
    container_name: ota-keycloak-db-init
    profiles: ["", "default"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env}"
    # Eine eigene Datenbank im vorhandenen Postgres statt eines zweiten
    # Servers. Idempotent: Beim zweiten Lauf passiert nichts.
    command: >
      sh -c 'psql -h db -U "${POSTGRES_USER:-ota}" -d "${POSTGRES_DB:-ota}" -tAc
      "SELECT 1 FROM pg_database WHERE datname='"'"'keycloak'"'"'" | grep -q 1
      || psql -h db -U "${POSTGRES_USER:-ota}" -d "${POSTGRES_DB:-ota}" -c "CREATE DATABASE keycloak"'
    restart: "no"
    networks:
      - internal

  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    container_name: ota-keycloak
    restart: unless-stopped
    depends_on:
      keycloak-db-init:
        condition: service_completed_successfully
    command: ["start", "--optimized=false"]
    environment:
      # Firmenproxy. Leer heisst: kein Proxy — die Vorgabe.
      #
      # `NO_PROXY` ist hier nicht Beiwerk: Ohne die Namen der eigenen Dienste
      # liefe jeder Aufruf an Agent, Keycloak und Registry durch den Proxy,
      # der sie nicht kennt. Siehe deploy/.env.example.
      HTTP_PROXY: "${OTA_HTTP_PROXY:-}"
      HTTPS_PROXY: "${OTA_HTTPS_PROXY:-}"
      NO_PROXY: "${OTA_NO_PROXY:-}"
      http_proxy: "${OTA_HTTP_PROXY:-}"
      https_proxy: "${OTA_HTTPS_PROXY:-}"
      no_proxy: "${OTA_NO_PROXY:-}"
      KC_DB: postgres
      KC_DB_URL: "jdbc:postgresql://db:5432/keycloak"
      KC_DB_USERNAME: "${POSTGRES_USER:-ota}"
      KC_DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in deploy/.env}"
      # Unter /auth, damit OTA und Keycloak sich **eine** Herkunft teilen.
      # Das ist kein Schoenheitsfehler, sondern der Grund, aus dem die
      # Desktop-Verknuepfungen den Anmeldeweg spaeter ueberstehen: Ein
      # Sprung zu einer fremden Herkunft verliesse den Geltungsbereich des
      # Manifests (auth-roadmap.md §5.6).
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Der Name kommt aus der Anfrage. Diese Anlage ist unter mehreren
      # Adressen erreichbar — IP im LAN, Name hinter dem Reverse Proxy —
      # und ein fest verdrahteter Hostname sperrte jeweils die andere aus.
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USER:-setup}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PW:?KEYCLOAK_ADMIN_PW fehlt in deploy/.env}"
      JAVA_OPTS_APPEND: "${KEYCLOAK_JAVA_OPTS:--Xms256m -Xmx512m}"
      # Der Themenspeicher.
      #
      # Steht er auf `true`, liest Keycloak eine Themendatei **einmal** und
      # haelt sie danach fest — ein Neustart raeumt das nicht ab, weil auch
      # der Browser sie 30 Tage lang behalten darf. Wer am Aussehen arbeitet,
      # aendert dann eine Datei und sieht nichts; gemessen am 2026-08-29, und
      # es kostete eine gute halbe Stunde Suche.
      #
      # Deshalb hier abschaltbar. Im Betrieb gehoert er an — er spart bei
      # jedem Seitenaufbau einen Dateizugriff.
      KC_SPI_THEME_CACHE_THEMES: "${KEYCLOAK_THEME_CACHE:-true}"
      KC_SPI_THEME_STATIC_MAX_AGE: "${KEYCLOAK_THEME_MAX_AGE:-2592000}"
    volumes:
      # Die Anmeldemaske im Gewand von OTA. Themes in diesem Verzeichnis
      # brauchen keinen Bau-Schritt — Keycloak liest sie direkt.
      - ./keycloak-theme/ota:/opt/keycloak/themes/ota:ro
    networks:
      - public
      - internal
    healthcheck:
      # Das Abbild bringt weder curl noch wget mit. Die Gesundheitsauskunft
      # liegt seit Fassung 25 auf dem eigenen Verwaltungsport 9000.
      test: ["CMD-SHELL",
             "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q 'UP' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=ota_public"
      # Priorität über der Weboberfläche, die jeden Pfad beantwortet.
      - "traefik.http.routers.ota-keycloak.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.ota-keycloak.entrypoints=websecure"
      - "traefik.http.routers.ota-keycloak.tls=true"
      - "traefik.http.routers.ota-keycloak.priority=60"
      - "traefik.http.services.ota-keycloak.loadbalancer.server.port=8080"

volumes:
  # Der zuletzt gewuenschte Zustand der Firewall. Auf Platte, damit ein
  # Neustart des Dienstes nichts vergisst — sonst staenden danach Sitzungen
  # ohne Freigaben da, und die Grundsperre haette sie stumm abgeschnitten.
  ota_firewall_state:
    name: ota_firewall_state

  registry-data:
    name: ota_registry_data

  db-data:
    name: ota_db_data

networks:
  # Traefik und die öffentlich erreichbaren Dienste.
  public:
    name: ota_public

  # Später: ota-api, ota-db, ota-agent. Kein Weg nach draussen.
  internal:
    name: ota_internal
    internal: true

  # Später: Session-Container. Erreichen ota-db bewusst nicht.
  sessions:
    name: ota_sessions
