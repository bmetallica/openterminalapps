# Auslieferung der Paketquellen (Handbuch Kapitel 26) — nur lesend, statisch.
# Was hier liegt, veröffentlicht aptly; geschrieben wird es vom Dienst `repo`.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz { return 200 "ok\n"; }

    location /repo/ {
        autoindex on;
        autoindex_exact_size off;
        # Release-Dateien ändern sich bei jedem Abgleich, Pakete nie — ein
        # Paket mit derselben Version hat in Debian denselben Inhalt.
        location ~ /(InRelease|Release|Release\.gpg|Packages[^/]*)$ { expires -1; }
    }
}
