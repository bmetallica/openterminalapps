server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-Page-App: unbekannte Pfade an die App geben, nicht mit 404 beantworten.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gehashte Assets dürfen lange gecacht werden, index.html niemals.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # API und Keycloak gehoeren nie hierher. Landet eine solche Anfrage doch
    # hier, dann nur, weil Traefik den Dienst gerade nicht fuehrt (Neustart,
    # Healthcheck rot). Frueher bekam sie dann die App — und die App schickte
    # von /api/auth/oidc/start aus wieder zur Anmeldung, mit genau dieser
    # Adresse als Ziel. Jede Runde verschachtelte sie tiefer, bis Traefik mit
    # 414 abbrach (2026-10-08, Betrieb). Jetzt: ein ehrliches 503, und ein
    # Mensch davor kommt nach ein paar Sekunden von selbst auf die Startseite.
    location ^~ /api/ {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="5;url=/"><title>OTA</title><body style="font:15px system-ui;background:#0b0f17;color:#cdd6e4;display:grid;place-items:center;height:100vh;margin:0"><p>OTA ist gleich wieder da &mdash; die Seite l&auml;dt in ein paar Sekunden neu.</p>';
    }
    location ^~ /auth/ {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "5" always;
        return 503 '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="5;url=/"><title>OTA</title><body style="font:15px system-ui;background:#0b0f17;color:#cdd6e4;display:grid;place-items:center;height:100vh;margin:0"><p>Die Anmeldung ist gleich wieder da &mdash; die Seite l&auml;dt in ein paar Sekunden neu.</p>';
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
