# Zertifikat austauschen: einfach deploy/certs/ota.crt und ota.key überschreiben.
# Traefik lädt die Datei durch `watch: true` von selbst neu, kein Neustart nötig.
# Beim Wechsel auf ein echtes Zertifikat (Let's Encrypt, Firmen-CA) bleibt
# dieser Block unverändert — nur die beiden Dateien ändern sich.

tls:
  certificates:
    - certFile: /etc/traefik/certs/ota.crt
      keyFile: /etc/traefik/certs/ota.key

  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/ota.crt
        keyFile: /etc/traefik/certs/ota.key

  options:
    default:
      minVersion: VersionTLS12
      sniStrict: false
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305

    # Für die Verbindung zu KasmVNC in den Session-Containern:
    # die sprechen HTTPS mit eigenem, selbstsigniertem Zertifikat.
