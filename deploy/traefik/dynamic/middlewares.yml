http:
  middlewares:

    # Sicherheits-Header.
    #
    # Bewusst NICHT gesetzt:
    #   - HSTS: Solange die lokale CA nicht in jedem Browser importiert ist,
    #     würde HSTS den "trotzdem fortfahren"-Ausweg entfernen und Nutzer
    #     komplett aussperren. Einschalten, sobald die CA verteilt oder ein
    #     echtes Zertifikat im Einsatz ist — siehe unten.
    #   - X-Frame-Options: DENY würde den Session-Viewer zerstören, der den
    #     Stream absichtlich in ein iframe einbettet. frame-ancestors in der
    #     CSP regelt das präziser.
    ota-headers:
      headers:
        contentTypeNosniff: true
        browserXssFilter: true
        referrerPolicy: "strict-origin-when-cross-origin"
        customResponseHeaders:
          # Die Zwischenablage muss ausdrücklich erlaubt werden. Ohne diesen
          # Header greift in manchen Browsern eine restriktive Vorgabe und
          # navigator.clipboard schlägt lautlos fehl.
          Permissions-Policy: "clipboard-read=(self), clipboard-write=(self), camera=(self), microphone=(self), fullscreen=(self)"
          # Trennt die Anwendung von fremden Fenstern, die sie geöffnet haben
          # könnten. Kostet nichts und betrifft eingebettete Streams nicht.
          Cross-Origin-Opener-Policy: "same-origin"
          # Cross-Origin-Embedder-Policy steht hier bewusst NICHT.
          #
          # Am 2026-08-27 war die fehlende Cross-Origin-Isolation der erste
          # Verdacht, warum die Zwischenablage im iframe nichts aus dem
          # Container liefert. require-corp wurde ergänzt, die Isolation stimmte
          # danach — am Ergebnis änderte sich nichts. Die wahre Ursache lag im
          # KasmVNC-Client (siehe plan.md §10.2 Punkt 5). Der Header ist wieder
          # draussen, weil er hier nichts bewirkt: Der Client dekodiert über
          # ImageDecoder, nicht über SharedArrayBuffer. Er hätte aber einen
          # Preis — require-corp lässt jede fremde Ressource ohne CORP
          # kommentarlos ausfallen, und genau solche Quellen kommen mit den
          # Kasm-Registries noch dazu.
          Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'"
          Server: ""

    # Erst aktivieren, wenn die CA verteilt oder ein echtes Zertifikat aktiv ist.
    # Dann in den Router zusätzlich zu ota-headers eintragen.
    ota-hsts:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false

    # Wird VOR jedem Request auf /s/<id>/... aufgerufen, auch vor dem
    # WebSocket-Handshake. Die API prüft, ob der Cookie zum Eigentümer der
    # Session gehört. Ohne diese Middleware könnte jeder mit einer Session-ID
    # fremde Bildschirme sehen.
    ota-authz:
      forwardAuth:
        address: "http://api:8000/api/internal/authz"
        trustForwardHeader: true
        authResponseHeaders:
          - X-Ota-User
