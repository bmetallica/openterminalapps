# Die Anmeldemaske im Gewand von OTA.
#
# Aufgesetzt auf `keycloak.v2` und nicht auf `keycloak`: Das ist die aktuelle
# Fassung, sie baut auf PatternFly 5 und bringt einen dunklen Modus mit — also
# genau die Grundlage, auf der sich OTAs Flaechen ohne Kampf abbilden lassen.
#
# `styles` **ersetzt** den Wert des Elternthemas, es wird nicht ergaenzt.
# Deshalb steht dessen Datei hier ausdruecklich zuerst; ohne sie faellt die
# gesamte Gestaltung weg und uebrig bleibt unformatiertes HTML.
parent=keycloak.v2
import=common/keycloak

styles=css/styles.css css/ota-farben.css

# Setzt `data-ota-gewand` am Wurzelelement, damit die Maske dem Gewand folgt,
# das der Mensch in OTA gewaehlt hat. Keycloak liegt hinter demselben Ingress
# und damit auf derselben Herkunft — es liest denselben localStorage.
scripts=js/gewand.js

# PatternFlys eigener Dunkelmodus bleibt aus: Ueber das Aussehen entscheidet
# OTA und nicht das Betriebssystem des Betrachters. Wer es hell will, stellt
# es in OTA um — und `js/gewand.js` traegt die Wahl hierher.
darkMode=false
