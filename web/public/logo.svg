<svg width="800" height="240" viewBox="0 0 800 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Canvas -->
  <rect width="800" height="240" rx="16" fill="#090D16"/>
  <rect x="1" y="1" width="798" height="238" rx="15" stroke="#1E293B" stroke-width="2"/>

  <!-- Logo Group Center -->
  <g transform="translate(160, 60)">
    <!-- Signet (Groß) -->
    <g transform="translate(0, 0)">
      <!-- Server Rack -->
      <rect x="0" y="90" width="120" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="2"/>
      <circle cx="16" cy="102" r="4" fill="#10B981"/>
      <circle cx="28" cy="102" r="4" fill="#06B6D4"/>
      <line x1="80" y1="102" x2="104" y2="102" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

      <!-- Stream Signals -->
      <line x1="60" y1="88" x2="60" y2="72" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 3"/>

      <!-- Stream Screen -->
      <rect x="0" y="0" width="120" height="74" rx="8" fill="#0F172A" stroke="#06B6D4" stroke-width="2.5"/>
      <path d="M0 8C0 3.58172 3.58172 0 8 0H112C116.418 0 120 3.58172 120 8V16H0V8Z" fill="#1E293B"/>
      <circle cx="10" cy="8" r="2.5" fill="#EF4444"/>
      <circle cx="18" cy="8" r="2.5" fill="#F59E0B"/>
      <circle cx="26" cy="8" r="2.5" fill="#10B981"/>

      <!-- Apps inside Screen -->
      <rect x="12" y="24" width="28" height="36" rx="4" fill="#3B82F6"/>
      <path d="M18 40 L24 43 L18 46" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      
      <rect x="46" y="24" width="28" height="36" rx="4" fill="#10B981"/>
      <line x1="52" y1="32" x2="68" y2="32" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      <line x1="52" y1="38" x2="62" y2="38" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
      
      <rect x="80" y="24" width="28" height="36" rx="4" fill="#8B5CF6"/>
      <rect x="86" y="32" width="16" height="12" rx="2" stroke="#FFFFFF" stroke-width="2"/>
    </g>

    <!-- Text Group -->
    <g transform="translate(150, 20)">
      <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="42" fill="#F8FAFC" letter-spacing="-1">
        OpenTerminal<tspan fill="#06B6D4" font-family="monospace" font-weight="700">Apps</tspan>
      </text>
      <text x="2" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="2">
        SELF-HOSTED VDI &amp; REMOTE APP GATEWAY
      </text>
    </g>
  </g>
</svg>
