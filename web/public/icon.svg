<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Hintergrund Squircle (Dark Slate) -->
  <rect width="512" height="512" rx="112" fill="#0F172A"/>
  
  <!-- Server-Basis / Rack (Unteres Element) -->
  <rect x="80" y="380" width="352" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="6"/>
  <circle cx="120" cy="406" r="8" fill="#10B981"/> <!-- Status LED grün -->
  <circle cx="148" cy="406" r="8" fill="#3B82F6"/> <!-- Status LED blau -->
  <line x1="320" y1="406" x2="400" y2="406" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Remote Window / Stream Frame -->
  <rect x="80" y="80" width="352" height="276" rx="20" fill="#1E293B" stroke="#334155" stroke-width="6"/>
  
  <!-- Window Header Bar -->
  <path d="M80 100C80 88.9543 88.9543 80 100 80H412C423.046 80 432 88.9543 432 100V124H80V100Z" fill="#0F172A"/>
  <circle cx="112" cy="102" r="6" fill="#EF4444"/>
  <circle cx="132" cy="102" r="6" fill="#F59E0B"/>
  <circle cx="152" cy="102" r="6" fill="#10B981"/>
  
  <!-- Remote Screen Canvas -->
  <rect x="96" y="140" width="320" height="200" rx="10" fill="#090D16"/>
  
  <!-- App Nodes / Remote Workspaces Inside Screen -->
  <!-- App 1: Container / Code -->
  <rect x="120" y="164" width="72" height="64" rx="10" fill="#3B82F6" fill-opacity="0.9"/>
  <path d="M144 188L156 196L144 204" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- App 2: Desktop / JetBrains -->
  <rect x="208" y="164" width="72" height="64" rx="10" fill="#10B981" fill-opacity="0.9"/>
  <rect x="224" y="180" width="40" height="32" rx="4" stroke="#FFFFFF" stroke-width="4"/>
  
  <!-- App 3: IDE Workspace -->
  <rect x="296" y="164" width="96" height="124" rx="10" fill="#8B5CF6" fill-opacity="0.9"/>
  <line x1="316" y1="188" x2="372" y2="188" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="316" y1="204" x2="356" y2="204" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <line x1="316" y1="220" x2="364" y2="220" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Remote Connection / Wireless Indicator -->
  <path d="M120 252C140 240 170 240 190 252" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
  <path d="M130 268C145 258 165 258 180 268" stroke="#06B6D4" stroke-width="5" stroke-linecap="round"/>
  <circle cx="155" cy="282" r="4" fill="#06B6D4"/>
</svg>
