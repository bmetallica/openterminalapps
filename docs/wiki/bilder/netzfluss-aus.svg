<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Stufe „Aus“ — alles durch. Der Router filtert nicht mehr — aber er bleibt der Weg. Auch hier kein Nachbar.">
  <title>Stufe „Aus“ — alles durch</title>
  <desc>Der Router filtert nicht mehr — aber er bleibt der Weg. Auch hier kein Nachbar.</desc>
  <style>
    .titel { fill: #F1F5F9; font: 600 14px system-ui, -apple-system, sans-serif; }
    .unter { fill: #94A3B8; font: 400 11px ui-monospace, monospace; }
    .urteil { font: 600 11.5px system-ui, sans-serif; }
    .kopf { fill: #F1F5F9; font: 600 15px system-ui, sans-serif; }
    .fuss { fill: #64748B; font: 400 11.5px system-ui, sans-serif; }
    /* `backwards`: Waehrend der Verzoegerung gilt schon der erste Keyframe —
       ohne das stuende ein Paket sichtbar an seiner Ruhelage und spraenge
       dann an den Anfang. */
    .paket { animation-timing-function: linear; animation-iteration-count: infinite;
             animation-fill-mode: backwards; }
    @media (prefers-reduced-motion: reduce) {
      .paket { animation: none !important; opacity: 1; }
    }
    @keyframes p0 {
    0.0% { transform: translate(200px, 165px); }
    29.6% { transform: translate(352px, 165px); }
    53.6% { transform: translate(470px, 131px); }
    63.3% { transform: translate(520px, 131px); }
    78.2% { transform: translate(596px, 131px); }
    91.0% { transform: translate(596px, 65px); }
    100.0% { transform: translate(642px, 65px); }
  }
  @keyframes p0-blende {
    0% { opacity: 0; } 8% { opacity: 1; }
    88% { opacity: 1; } 100% { opacity: 0; }
  }
  @keyframes p1 {
    0.0% { transform: translate(200px, 165px); }
    34.4% { transform: translate(352px, 165px); }
    61.1% { transform: translate(470px, 165px); }
    72.4% { transform: translate(520px, 165px); }
    89.6% { transform: translate(596px, 165px); }
    89.6% { transform: translate(596px, 165px); }
    100.0% { transform: translate(642px, 165px); }
  }
  @keyframes p1-blende {
    0% { opacity: 0; } 8% { opacity: 1; }
    88% { opacity: 1; } 100% { opacity: 0; }
  }
  @keyframes p2 {
    0.0% { transform: translate(200px, 165px); }
    100.0% { transform: translate(266px, 187px); }
  }
  @keyframes p2-blende {
    0% { opacity: 0; } 8% { opacity: 1; }
    88% { opacity: 1; } 100% { opacity: 0; }
  }
  </style>
  <rect width="860" height="330" fill="#090D16"/>
  <text class="kopf" x="24" y="30">Stufe „Aus“ — alles durch</text>
  <text class="fuss" x="24" y="318">Der Router filtert nicht mehr — aber er bleibt der Weg. Auch hier kein Nachbar.</text>
