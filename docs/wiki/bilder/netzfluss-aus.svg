  <rect class="paket" x="-7" y="-5" width="14" height="10" rx="2.5" fill="#06B6D4" transform="translate(352 165)" style="animation-name: p1, p1-blende; animation-duration: 4.2s, 4.2s; animation-delay: 0.8s, 0.8s;"/>
  <rect class="paket" x="-7" y="-5" width="14" height="10" rx="2.5" fill="#EF4444" transform="translate(200 165)" style="animation-name: p2, p2-blende; animation-duration: 4.2s, 4.2s; animation-delay: 1.6s, 1.6s;"/>
